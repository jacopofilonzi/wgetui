# Runs `make check` (format, Release build with warnings as errors, tests) on every push and pull request.
# Windows runner: the projects target net10.0-windows / win-x64. No winget COM calls happen here
# (tests use fakes; `make smoke` is never run in CI).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Ensure GNU make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make -y --no-progress }
          make --version

      - name: make check
        run: make check
